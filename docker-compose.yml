services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html #  ホストの全ファイルをコンテナに同期
    depends_on:
      - db
    # 権限設定が必要な場合は、Laravelをインストールした「後」に実行するのが安全です。
    # 最初は command を削除して、Dockerfile側のデフォルト（apache2-foreground）で動かすのが無難です。

  db:
    image: mysql:8.0
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: laravel
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: